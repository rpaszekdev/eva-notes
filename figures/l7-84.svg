<rect x="5" y="150" width="210" height="62" rx="5" fill="#eef4fb"></rect>
</g>
<g font-size="11.5" text-anchor="middle" fill="#13294b">
<text x="280" y="30" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Distressing conversation, causing my heart to race</text>
<text x="280" y="93" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">'There is something wrong with my heart' or</text>
<text x="280" y="110" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">'My conversation partner will find me uninteresting'</text>
<text x="470" y="185" font-weight="700" font-size="13" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">ANXIETY</text>
<text x="280" y="269" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Rapid heartbeat, quickened breathing, sweating  or</text>
<text x="280" y="286" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Blushing, shaking, loss of concentration</text>
<text x="110" y="172" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">'Look, a heart attack!' or</text>
<text x="110" y="189" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">'He can see me blushing</text>
<text x="110" y="204" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">and trembling now!'</text>
</g>
<g stroke="#13294b" stroke-width="1.5" fill="none">
<line x1="280" y1="42" x2="280" y2="72" marker-end="url(#l7arr2)"></line>
<line x1="400" y1="120" x2="450" y2="158" marker-end="url(#l7arr2)"></line>
<line x1="450" y1="200" x2="400" y2="248" marker-end="url(#l7arr2)"></line>
<line x1="170" y1="250" x2="120" y2="214" marker-end="url(#l7arr2)"></line>
<line x1="120" y1="150" x2="170" y2="122" marker-end="url(#l7arr2)"></line>
</g>
