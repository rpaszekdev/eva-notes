<svg width="560" height="320" viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="l7arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#13294b"></path></marker></defs>
<g stroke="#13294b" stroke-width="1.4" fill="#fff">
<rect x="140" y="8" width="280" height="34" rx="5"></rect>
<rect x="105" y="74" width="350" height="46" rx="5" fill="#eef4fb"></rect>
<rect x="395" y="160" width="150" height="40" rx="5" fill="#fdecec"></rect>
