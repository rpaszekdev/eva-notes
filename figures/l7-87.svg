<svg width="660" height="562" viewBox="0 0 660 562" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l78v_a13" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs><defs><marker id="l78v_a13b" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#13294b"></path></marker></defs><path d="M70,60 C70,660.0 590,660.0 590,60 Z" fill="#f7b39a"></path><path d="M70,60 C70,582.7 590,582.7 590,60 Z" fill="#ee3524"></path><path d="M70,60 C70,505.3 590,505.3 590,60 Z" fill="#cfeaf2"></path><path d="M70,60 C70,444.0 590,444.0 590,60 Z" fill="#8fd0e4"></path><path d="M70,60 C70,382.7 590,382.7 590,60 Z" fill="#0a9fc6"></path><path d="M70,60 C70,316.0 590,316.0 590,60 Z" fill="#e6f0d8"></path><path d="M70,60 C70,249.3 590,249.3 590,60 Z" fill="#c7dfb0"></path><path d="M70,60 C70,182.7 590,182.7 590,60 Z" fill="#9dc97a"></path><path d="M70,60 C70,120.0 590,120.0 590,60 Z" fill="#6db33f"></path><text x="330" y="86.5" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Depressed mood</text><circle cx="278" cy="82.5" r="5" fill="#e0301e" stroke="#fff" stroke-width="1"></circle><text x="330" y="132.5" font-size="11.5" font-weight="500" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Anhedonia</text><circle cx="294" cy="128.5" r="5" fill="#e0301e" stroke="#fff" stroke-width="1"></circle><text x="330" y="181.0" font-size="11.5" font-weight="500" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Feelings of worthlessness or guilt</text><text x="330" y="231.0" font-size="11.5" font-weight="500" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Suicidal ideation, plan, or attempt</text><text x="330" y="281.0" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">Fatigue or loss of energy</text><text x="330" y="329.0" font-size="11.5" font-weight="500" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Sleep ↓ or ↑</text><text x="330" y="375.0" font-size="11.5" font-weight="500" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Weight or appetite ↓ or ↑</text><text x="330" y="420.0" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">↓ Ability to think or concentrate,</text><text x="330" y="434.0" font-size="11.5" font-weight="600" fill="#fff" text-anchor="middle">or indecisiveness</text><text x="330" y="478.0" font-size="11.5" font-weight="500" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Psychomotor retardation</text><text x="330" y="492.0" font-size="11.5" font-weight="500" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">or agitation</text><line x1="50" y1="60" x2="610" y2="60" stroke="#1d2733" stroke-width="1.2"></line><line x1="74" y1="40" x2="586" y2="40" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a13)" marker-start="url(#l78v_a13b)"></line><text x="330" y="30" font-size="11.5" font-weight="600" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Symptoms of depression (2 weeks)</text><line x1="50" y1="60" x2="50" y2="534" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a13)"></line><text x="20" y="554" font-size="11.5" font-weight="600" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Cumulative functional impairment</text><circle cx="456" cy="466" r="5.5" fill="#e0301e"></circle><text x="468" y="470" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-