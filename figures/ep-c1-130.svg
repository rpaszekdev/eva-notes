<svg width="680" height="230" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ep1arr2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs>
<g font-size="12.5" fill="#13294b">
<text x="14" y="26" font-weight="700" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Before learning</text>
<rect x="14" y="34" width="150" height="34" rx="7" fill="#fbf6e8" stroke="#c9a227"></rect><text x="89" y="56" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">US — food</text>
<line x1="168" y1="51" x2="228" y2="51" stroke="#13294b" stroke-width="1.5" marker-end="url(#ep1arr2)"></line>
<rect x="232" y="34" width="160" height="34" rx="7" fill="#eefaf2" stroke="#1f8a4c"></rect><text x="312" y="56" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">UR — salivation</text>
<rect x="14" y="78" width="150" height="34" rx="7" fill="#eef4fb" stroke="#13294b"></rect><text x="89" y="100" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">neutral stimulus — bell</text>
<line x1="168" y1="95" x2="228" y2="95" stroke="#13294b" stroke-width="1.5" marker-end="url(#ep1arr2)"></line>
<rect x="232" y="78" width="160" height="34" rx="7" fill="#f7f8fb" stroke="#b9c0cc"></rect><text x="312" y="100" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">no salivation</text>
<text x="14" y="140" font-weight="700" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">During learning — repeated pairing</text>
<rect x="14" y="148" width="150" height="34" rx="7" fill="#eef4fb" stroke="#13294b"></rect><text x="89" y="170" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">bell + food</text>
<line x1="168" y1="165" x2="228" y2="165" stroke="#13294b" stroke-width="1.5" marker-end="url(#ep1arr2)"></line>
<rect x="232" y="148" width="160" height="34" rx="7" fill="#eefaf2" stroke="#1f8a4c"></rect><text x="312" y="170" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">UR — salivation</text>
<text x="412" y="26" font-weight="700" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">After learning</text>
<rect x="412" y="34" width="120" height="34" rx="7" fill="#fdecec" stroke="#c0392b"></rect><text x="472" y="56" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">CS — bell</text>
<line x1="536" y1="51" x2="560" y2="51" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ep1arr2)"></line>
<rect x="412" y="78" width="190" height="34" rx="7" fill="#fdecec" stroke="#c0392b"></rect><text x="507" y="100" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">CR — salivation</text>
<text x="412" y="140" font-size="11.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">The CR is the same response as the UR,</text>
<text x="412" y="156" font-size="11.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">but now it happens <tspan font-weight="700">without</tspan> the original US.</text>
</g>
<text x="310" y="214" text-anchor="middle" font-size="12" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">US → UR · neutral stimulus + US, repeated · then the neutral stimulus alone becomes CS → CR</text>
</svg>