<svg width="640" height="220" viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg">
<text x="200" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Monocular cues (one eye is enough)</text>
<path d="M100,195 L200,45 L300,195 Z" fill="none" stroke="#13294b" stroke-width="1.4"></path>
<line x1="130" y1="195" x2="270" y2="195" stroke="#13294b" stroke-width="1.4"></line>
<rect x="140" y="130" width="60" height="55" fill="#1c5fb0" opacity="0.9"></rect>
<rect x="152" y="95" width="42" height="38" fill="#1c5fb0" opacity="0.65"></rect>
<rect x="162" y="72" width="26" height="24" fill="#1c5fb0" opacity="0.4"></rect>
<text x="200" y="212" text-anchor="middle" font-size="10" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">linear perspective + interposition + relative size</text>
<line x1="330" y1="18" x2="330" y2="212" stroke="#cdd3dc"></line>
<text x="480" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Binocular cues (need both eyes)</text>
<circle cx="430" cy="55" r="14" fill="#eef4fb" stroke="#1c5fb0" stroke-width="2"></circle>
<circle cx="490" cy="55" r="14" fill="#fbf6e8" stroke="#c9a227" stroke-width="2"></circle>
<circle cx="460" cy="160" r="7" fill="#c0392b"></circle>
<line x1="430" y1="55" x2="460" y2="160" stroke="#1c5fb0" stroke-width="1.4"></line>
<line x1="490" y1="55" x2="460" y2="160" stroke="#c9a227" stroke-width="1.4"></line>
<text x="460" y="195" text-anchor="middle" font-size="10" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">binocular disparity → stereopsis (3D)</text>
<text x="460" y="210" text-anchor="middle" font-size="10" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">bigger difference between the eyes = closer object</text>
</svg>