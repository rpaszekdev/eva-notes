<text x="320" y="24" text-anchor="middle" font-size="10.5" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">category boundary ("the flip")</text>
<text x="130" y="55" font-size="11" fill="#999" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">if perception were gradual</text>
