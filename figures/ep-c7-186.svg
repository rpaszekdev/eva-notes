<text x="60" y="228" font-size="12" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">more like A (e.g. green / /ba/)</text>
<text x="580" y="228" text-anchor="end" font-size="12" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">more like B (e.g. yellow / /da/)</text>
