<text x="320" y="130" text-anchor="middle" font-size="9.5" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">The auditory nerve has ≈50,000 fibers; the place-code (tonotopic map) is kept all the way to A1.</text>
