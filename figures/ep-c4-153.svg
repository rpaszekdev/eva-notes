<rect x="122" y="42" width="90" height="50" rx="6" fill="#eef4fb" stroke="#1c5fb0"></rect><text x="167" y="63" text-anchor="middle" font-size="10" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Cochlear</text><text x="167" y="77" text-anchor="middle" font-size="10" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">nucleus</text>
<rect x="224" y="42" width="90" height="50" rx="6" fill="#fbf6e8" stroke="#c9a227"></rect><text x="269" y="63" text-anchor="middle" font-size="10.5" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Superior</text><text x="269" y="77" text-anchor="middle" font-size="10.5" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">olive</text>
