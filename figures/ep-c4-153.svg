<rect x="428" y="42" width="90" height="50" rx="6" fill="#eef4fb" stroke="#1c5fb0"></rect><text x="473" y="63" text-anchor="middle" font-size="9.5" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Medial</text><text x="473" y="77" text-anchor="middle" font-size="9.5" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">geniculate</text>
