<rect x="345" y="30" width="260" height="120" rx="8" fill="#fff" stroke="#cdd3dc"></rect>
<g>
<rect x="365" y="46" width="12" height="28" fill="#1c5fb0"></rect><rect x="407" y="46" width="28" height="12" fill="#c0392b"></rect><rect x="449" y="46" width="12" height="28" fill="#1c5fb0"></rect><rect x="491" y="46" width="28" height="12" fill="#c0392b"></rect><rect x="533" y="46" width="12" height="28" fill="#1c5fb0"></rect>
