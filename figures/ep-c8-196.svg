<rect x="134" y="96" width="12" height="28" fill="#c0392b"></rect>
<text x="160" y="168" text-anchor="middle" font-size="11.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">found immediately, whatever the number of distractors</text>
