<rect x="50" y="46" width="12" height="28"></rect><rect x="92" y="46" width="12" height="28"></rect><rect x="134" y="46" width="12" height="28"></rect><rect x="176" y="46" width="12" height="28"></rect><rect x="218" y="46" width="12" height="28"></rect>
