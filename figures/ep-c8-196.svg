<text x="475" y="168" text-anchor="middle" font-size="11.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">you must check items one by one (serial, focused attention)</text>
<text x="320" y="198" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Treisman's Feature Integration Theory: attention is the <tspan font-weight="700">glue</tspan> that binds colour, form and motion into one object.</text>
