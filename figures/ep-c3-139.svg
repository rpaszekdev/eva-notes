<svg width="640" height="380" viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg">
<rect x="70" y="30" width="520" height="280" fill="#fff" stroke="#cdd3dc"></rect>
<line x1="70" y1="310" x2="590" y2="310" stroke="#13294b" stroke-width="1.6"></line>
<line x1="70" y1="30" x2="70" y2="310" stroke="#13294b" stroke-width="1.6"></line>
<text x="330" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">spatial resolution (where?) — poor → good</text>
<text x="24" y="170" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" transform="rotate(-90 24 170)" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">temporal resolution (when?) — poor → good</text>
<g font-size="11.5">
<circle cx="180" cy="80" r="9" fill="#1c5fb0"></circle><text x="196" y="78" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">EEG</text><text x="196" y="93" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">ms precision, poor localisation</text>
<circle cx="440" cy="70" r="9" fill="#1f8a4c"></circle><text x="456" y="68" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">MEG</text><text x="456" y="83" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">fast <tspan font-style="italic">and</tspan> good localisation</text>
<circle cx="520" cy="60" r="9" fill="#5b3fa0"></circle><text x="440" y="118" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">single-cell recording</text><text x="440" y="133" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">one neuron, very precise</text>
<circle cx="470" cy="240" r="9" fill="#c9a227"></circle><text x="330" y="238" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">fMRI</text><text x="330" y="253" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">blood flow → slow, good localisation</text>
<circle cx="500" cy="285" r="9" fill="#c0392b"></circle><text x="330" y="283" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">PET</text><text x="330" y="298" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">seconds at best, good localisation</text>
</g>
<text x="330" y="18" text-anchor="middle" font-size="12" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Top-right = fast and precise. Note where EEG sits: great timing, weak localisation.</text>
</svg>