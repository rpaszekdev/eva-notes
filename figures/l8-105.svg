<svg width="985" height="565" style="max-width:100%" viewBox="0 0 985 565" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l78v_a51" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs><rect x="18" y="112" width="122" height="56" fill="#eef4fb" stroke="#1c5fb0" stroke-width="1.6"></rect><text x="26" y="129" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Biological</text><text x="26" y="143" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">vulnerability</text><text x="26" y="157" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">anxiety disposition</text><rect x="150" y="50" width="110" height="36" fill="#eef4fb" stroke="#1c5fb0" stroke-width="1.6"></rect><text x="158" y="67" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Achondroplasia</text><rect x="290" y="16" width="268" height="104" fill="#fdecec" stroke="#c0392b" stroke-width="1.6"></rect><text x="298" y="33" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Chronic stressors</text><text x="298" y="47" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">1. stares (children, adults)</text><text x="298" y="61" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">2. functional difficulties (e.g. doorbells,</text><text x="298" y="75" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">mailbox, shop shelves…)</text><text x="298" y="89" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">3. efforts to lead a “normal life”</text><text x="298" y="103" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(e.g. full-time work, pregnancy…)</text><rect x="612" y="50" width="156" height="42" fill="#fbf6e8" stroke="#13294b" stroke-width="1.6"></rect><text x="620" y="67" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Fatigue / exhaustion</text><text x="620" y="81" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(physical, cognitive)</text><rect x="808" y="40" width="162" height="58" fill="#fbf6e8" stroke="#13294b" stroke-width="1.6"></rect><text x="816" y="57" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Depressive symptoms</text><text x="816" y="71" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(low mood, no pleasure,</text><text x="816" y="85" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">…)</text><rect x="570" y="168" width="162" height="58" fill="#fbf6e8" stroke="#13294b" stroke-width="1.6"></rect><text x="578" y="185" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Lowered self-image</text><text x="578" y="199" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“I want to be normal…</text><text x="578" y="213" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">and yet I’m not”</text><rect x="280" y="190" width="268" height="100" fill="#eef4fb" stroke="#1c5fb0" stroke-width="1.6"></rect><text x="288" y="207" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Cognitive vulnerability:</text><text x="288" y="221" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">1. ambivalent self-evaluations</text><text x="288" y="235" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">2. exaggerated sense of responsibility</text><text x="288" y="249" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">3. overestimating threat + consequences</text><text x="288" y="263" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">4. intolerance of uncertainty</text><text x="288" y="277" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">5. perfectionism</text><rect x="90" y="244" width="142" height="62" fill="#fdecec" stroke="#c0392b" stroke-width="1.6"></rect><text x="98" y="261" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Situational variables</text><text x="98" y="275" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(home, work, acute</text><text x="98" y="289" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">stressors, fatigue)</text><rect x="200" y="340" width="146" height="86" fill="#fff" stroke="#1d2733" stroke-width="1.6"></rect><text x="208" y="357" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Intrusions</text><text x="208" y="371" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">e.g. “Did I or others</text><text x="208" y="385" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">turn off the light? Is</text><text x="208" y="399" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">the gas stove properly</text><text x="208" y="413" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">turned off?” …</text><rect x="384" y="318" width="216" height="140" fill="#fff" stroke="#1d2733" stroke-width="1.6"></rect><text x="392" y="335" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Appraisals (product)</text><text x="392" y="349" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">1. catastrophic interpretation of</text><text x="392" y="363" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">intrusions (e.g. “they saw me and</text><text x="392" y="377" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">I must prevent something going</text><text x="392" y="391" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">wrong, because then I’m responsible</text><text x="392" y="405" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">and I get the blame”)</text><text x="392" y="419" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">2. failing control (“I didn’t look</text><text x="392" y="433" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">properly”)</text><rect x="628" y="352" width="146" height="62" fill="#fbf6e8" stroke="#13294b" stroke-width="1.6"></rect><text x="636" y="369" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Anxiety, tension,</text><text x="636" y="383" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">blushing, sweating,</text><text x="636" y="397" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">compulsive urge</text><rect x="800" y="318" width="168" height="114" fill="#fbf6e8" stroke="#13294b" stroke-width="1.6"></rect><text x="808" y="335" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Covert &amp; overt</text><text x="808" y="349" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">compulsive behaviour</text><text x="808" y="363" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">e.g. checking</text><text x="808" y="377" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(self/others), seeking</text><text x="808" y="391" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">reassurance (phoning),</text><text x="808" y="405" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">avoiding, convincing</text><text x="808" y="419" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">oneself</text><rect x="790" y="452" width="178" height="56" fill="#fff" stroke="#1d2733" stroke-width="1.6"></rect><text x="798" y="469" font-size="11" font-weight="700" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Metacognitive confidence</text><text x="798" y="483" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">e.g. doubting own memory</text><text x="798" y="497" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">and attention</text><polyline points="260,68 288,68" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="558,71 610,71" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="768,71 806,71" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="79,112 79,6 585,6 585,68" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="424,120 424,146 651,146 651,166" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="732,197 889,197 889,100" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="79,168 79,383 198,383" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="161,306 161,380" fill="none" stroke="#13294b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#l78v_a51)"></polyline><polyline points="364,290 364,380" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="346,383 382,383" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="600,385 626,385" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="701,414 701,442 860,442 860,434" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="884,318 884,304 450,304" fill="none" stroke="#13294b" stroke-width="1.5"></polyline><polyline points="450,304 450,316" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="630,304 630,228" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="750,304 750,94" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="700,304 700,350" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="930,432 930,450" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><polyline points="790,480 273,480 273,428" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l78v_a51)"></polyline><text x="24" y="506" font-size="11.5" font-weight="700" fill="#1f8a4c" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Strengths (krachtbronnen):</text><text x="30" y="522" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">– social safety net (partner, parents, friends, association for people of short stature)</text><text x="30" y="538" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">– hobbies</text><text x="30" y="554" font-size="11" font-weight="400" fill="#1d2733" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">– drive to lead a good-quality life</text></svg>