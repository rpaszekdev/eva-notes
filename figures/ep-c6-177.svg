<svg width="654" height="470" viewBox="0 0 654 470" xmlns="http://www.w3.org/2000/svg">
<text x="160" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#1c5fb0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Fixed ratio (FR)</text>
<line x1="40" y1="195" x2="300" y2="195" stroke="#13294b" stroke-width="1.3"></line>
<line x1="40" y1="195" x2="40" y2="35" stroke="#13294b" stroke-width="1.3"></line>
<path d="M40 195 L85 115 L108 115 L150 55 L172 55 L215 25" fill="none" stroke="#1c5fb0" stroke-width="2.4"></path>
<circle cx="85" cy="115" r="4" fill="#1c5fb0"></circle><circle cx="150" cy="55" r="4" fill="#1c5fb0"></circle><circle cx="215" cy="25" r="4" fill="#1c5fb0"></circle>
<text x="96" y="132" text-anchor="middle" font-size="9.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">pause</text>
<text x="160" y="215" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">e.g. every 6th response reinforced</text>
<text x="160" y="229" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">→ high rate, brief pause after reward</text>

<text x="480" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Variable ratio (VR)</text>
<line x1="360" y1="195" x2="620" y2="195" stroke="#13294b" stroke-width="1.3"></line>
<line x1="360" y1="195" x2="360" y2="35" stroke="#13294b" stroke-width="1.3"></line>
<path d="M360 195 C420 150 470 90 605 30" fill="none" stroke="#1f8a4c" stroke-width="2.4"></path>
<circle cx="405" cy="160" r="4" fill="#1f8a4c"></circle><circle cx="460" cy="115" r="4" fill="#1f8a4c"></circle><circle cx="530" cy="70" r="4" fill="#1f8a4c"></circle><circle cx="575" cy="48" r="4" fill="#1f8a4c"></circle>
<text x="480" y="215" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">e.g. slot machine (payout ~every 100 pulls)</text>
<text x="480" y="229" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">→ high, steady rate, no pauses; most resistant to extinction</text>

<text x="160" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Fixed interval (FI)</text>
<line x1="40" y1="435" x2="300" y2="435" stroke="#13294b" stroke-width="1.3"></line>
<line x1="40" y1="435" x2="40" y2="275" stroke="#13294b" stroke-width="1.3"></line>
<path d="M40 435 C60 432 75 428 85 415 C95 400 100 385 110 375 L110 375 C120 372 130 368 140 350 C150 330 155 310 165 300 C175 292 185 285 195 270" fill="none" stroke="#c0392b" stroke-width="2.4"></path>
<circle cx="110" cy="375" r="4" fill="#c0392b"></circle><circle cx="165" cy="300" r="4" fill="#c0392b"></circle>
<text x="160" y="455" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">e.g. reinforcement every 2 minutes</text>
<text x="160" y="469" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">→ scallop shape: slow after reward, fast just before</text>

<text x="480" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5c00" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Variable interval (VI)</text>
<line x1="360" y1="435" x2="620" y2="435" stroke="#13294b" stroke-width="1.3"></line>
<line x1="360" y1="435" x2="360" y2="275" stroke="#13294b" stroke-width="1.3"></line>
<path d="M360 435 C420 410 470 370 520 335 C555 310 585 295 605 280" fill="none" stroke="#7a5c00" stroke-width="2.4"></path>
<circle cx="420" cy="410" r="4" fill="#7a5c00"></circle><circle cx="500" cy="345" r="4" fill="#7a5c00"></circle><circle cx="570" cy="300" r="4" fill="#7a5c00"></circle>
<text x="480" y="455" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">e.g. reinforcement after 1, 3, 2 minutes on average</text>
<text x="480" y="469" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">→ slow, steady rate, no scallops</text>
</svg>