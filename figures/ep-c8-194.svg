<text x="320" y="218" text-anchor="middle" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">HIGH load on the main task → early selection (no spare capacity for anything else)</text>
