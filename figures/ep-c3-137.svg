<svg width="640" height="170" viewBox="0 0 640 170" xmlns="http://www.w3.org/2000/svg">
<text x="320" y="22" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Stroop task — say the COLOUR of the letters, not the word</text>
<rect x="40" y="40" width="250" height="100" rx="9" fill="#eefaf2" stroke="#1f8a4c"></rect>
<text x="165" y="62" text-anchor="middle" font-size="11.5" fill="#155c33" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">easy: colour and word match</text>
<text x="70" y="100" font-size="21" font-weight="700" fill="#1c5fb0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">BLUE</text>
<text x="150" y="100" font-size="21" font-weight="700" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">GREEN</text>
<text x="240" y="100" font-size="21" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">RED</text>
<text x="165" y="128" text-anchor="middle" font-size="11.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">fast, almost no effort</text>
<rect x="350" y="40" width="250" height="100" rx="9" fill="#fdecec" stroke="#c0392b"></rect>
<text x="475" y="62" text-anchor="middle" font-size="11.5" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">hard: colour and word conflict</text>
<text x="368" y="100" font-size="21" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">GREEN</text>
<text x="462" y="100" font-size="21" font-weight="700" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">BLUE</text>
<text x="540" y="100" font-size="21" font-weight="700" fill="#1c5fb0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">RED</text>
<text x="475" y="128" text-anchor="middle" font-size="11.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">slower — you must inhibit reading</text>
</svg>