<text x="320" y="296" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">UR and CR are the very same response — the only difference is whether it is triggered <b>naturally</b> (UR) or <b>learned</b> (CR).</text>
