<svg width="660" height="260" viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg">
<text x="330" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Same % change, different absolute amount</text>
<text x="330" y="38" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Weber's law: the JND is always the same <tspan font-weight="700">proportion</tspan> of the standard — the Weber fraction.</text>
<line x1="90" y1="210" x2="450" y2="210" stroke="#13294b" stroke-width="1.6"></line>
<rect x="140" y="160" width="70" height="50" fill="#eef4fb" stroke="#13294b"></rect>
<rect x="140" y="154" width="70" height="6" fill="#c9a227" stroke="#7a5c00"></rect>
<text x="175" y="228" text-anchor="middle" font-size="11" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">100 g salt (standard)</text>
<text x="175" y="140" text-anchor="middle" font-size="10.5" fill="#7a5c00" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">+8.3 g → just noticeable</text>
<rect x="340" y="110" width="70" height="100" fill="#eef4fb" stroke="#13294b"></rect>
<rect x="340" y="99" width="70" height="11" fill="#c9a227" stroke="#7a5c00"></rect>
<text x="375" y="228" text-anchor="middle" font-size="11" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">200 g salt (standard)</text>
<text x="375" y="85" text-anchor="middle" font-size="10.5" fill="#7a5c00" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">+16.6 g → just noticeable</text>
<text x="375" y="70" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(still 8.3%)</text>
<rect x="460" y="130" width="170" height="90" rx="8" fill="#e9f7f6" stroke="#0f7c74"></rect>
<text x="545" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#0f5f59" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Weber's law</text>
<text x="545" y="172" text-anchor="middle" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">ΔI / I = k (constant)</text>
<text x="545" y="190" text-anchor="middle" font-size="10.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">k = the Weber fraction</text>
<text x="545" y="206" text-anchor="middle" font-size="10.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">smaller k = better sensitivity</text>
</svg>