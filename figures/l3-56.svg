<svg width="600" height="182" viewBox="0 0 600 182" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l3v_a20" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs><rect x="20" y="15" width="245" height="82" rx="8" fill="#e9f7f6" stroke="#0f7c74" stroke-width="1.4"></rect><text x="142.5" y="35" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">General influence</text><text x="142.5" y="52.5" text-anchor="middle" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Attention, calm and presence</text><text x="142.5" y="67.5" text-anchor="middle" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">encourage the client to talk.</text><circle cx="300" cy="56" r="22" fill="#fff" stroke="#c0392b" stroke-width="1.4"></circle><line x1="285" y1="56" x2="313" y2="56" stroke="#c0392b" stroke-width="1.6" marker-end="url(#l3v_a20)"></line><rect x="335" y="15" width="245" height="82" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.4"></rect><text x="457.5" y="35" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Directional attention</text><text x="457.5" y="52.5" text-anchor="middle" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">What you respond to often gets</text><text x="457.5" y="67.5" text-anchor="middle" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">more space in the story.</text><text x="300" y="125" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Question: what response(s) could you give?</text><rect x="75" y="137" width="450" height="36" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"></rect><text x="300" y="160" text-anchor="middle" font-size="11.5" font-weight="400" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Client: “I’m not good at anything. I fail at absolutely everything.”</text></svg>