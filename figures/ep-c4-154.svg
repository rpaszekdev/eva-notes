<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
<text x="170" y="16" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Localizing sound: two binaural cues</text>
<text x="300" y="38" text-anchor="middle" font-size="9.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">sound source</text>
<circle cx="300" cy="52" r="6" fill="#c9a227"></circle>
<circle cx="143" cy="100" r="50" fill="#fff" stroke="#13294b" stroke-width="2"></circle>
<circle cx="93" cy="100" r="6" fill="#13294b"></circle><text x="93" y="118" text-anchor="middle" font-size="9" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">left ear</text>
<circle cx="193" cy="100" r="6" fill="#13294b"></circle><text x="193" y="118" text-anchor="middle" font-size="9" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">right ear</text>
<line x1="300" y1="52" x2="93" y2="100" stroke="#13294b" stroke-width="1.3" stroke-dasharray="4 3"></line>
<line x1="300" y1="52" x2="193" y2="100" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4 3"></line>
<text x="160" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">longer path</text>
<text x="266" y="88" text-anchor="middle" font-size="9" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">shorter path</text>
<rect x="340" y="15" width="280" height="85" rx="8" fill="#eef4fb" stroke="#1c5fb0"></rect>
<text x="350" y="32" font-size="10.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">ITD — interaural TIME difference</text>
<text x="350" y="48" font-size="10" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Sound arrives sooner in the closer ear.</text>
<text x="350" y="64" font-size="10" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Best cue for LOW frequencies (they bend</text>
<text x="350" y="78" font-size="10" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">around the head — similar loudness).</text>
<rect x="340" y="115" width="280" height="85" rx="8" fill="#fdecec" stroke="#c0392b"></rect>
<text x="350" y="132" font-size="10.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">ILD — interaural LEVEL difference</text>
<text x="350" y="148" font-size="10" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Sound is louder in the closer ear.</text>
<text x="350" y="164" font-size="10" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Best cue for HIGH frequencies (head</text>
<text x="350" y="178" font-size="10" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">casts an acoustic shadow).</text>
<path d="M90,170 L40,225 L140,225 Z" fill="#f1edfb" stroke="#5b3fa0" stroke-width="1.4"></path>
<text x="90" y="238" text-anchor="middle" font-size="9" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">cone of confusion: front vs back</text>
<text x="90" y="251" text-anchor="middle" font-size="9" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">share the same ITD &amp; ILD (≈0)</text>
</svg>