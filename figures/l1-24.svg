<text x="320" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Diagnostic question:</text><text x="320" y="188" text-anchor="middle" font-size="12" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Where can the cycle most feasibly</text><text x="320" y="204" text-anchor="middle" font-size="12" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">be interrupted?</text>
