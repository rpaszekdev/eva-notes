<svg width="640" height="330" viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="l1arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#13294b"></path></marker><marker id="l1arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"></path></marker></defs>
<rect x="230" y="12" width="180" height="52" rx="9" fill="#fdecec" stroke="#c0392b"></rect><text x="320" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Stress</text><text x="320" y="51" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">deadline, conflict, loss</text>
<rect x="450" y="105" width="180" height="52" rx="9" fill="#eef4fb" stroke="#13294b"></rect><text x="540" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Avoidance</text><text x="540" y="144" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">less active, procrastination</text>
<rect x="360" y="255" width="190" height="52" rx="9" fill="#eef4fb" stroke="#13294b"></rect><text x="455" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Less reward</text><text x="455" y="294" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">less joy, fewer positive experiences</text>
<rect x="95" y="255" width="185" height="52" rx="9" fill="#eef4fb" stroke="#13294b"></rect><text x="187" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Sadness</text><text x="187" y="294" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">negative thoughts increase</text>
<rect x="10" y="105" width="190" height="52" rx="9" fill="#eef4fb" stroke="#13294b"></rect><text x="105" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Less energy</text><text x="105" y="144" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">problem-solving gets harder</text>
