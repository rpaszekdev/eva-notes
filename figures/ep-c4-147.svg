<svg width="660" height="245" viewBox="0 0 660 245" xmlns="http://www.w3.org/2000/svg">
<text x="170" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Trichromatic theory — receptor level</text>
<text x="170" y="34" text-anchor="middle" font-size="10" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">3 cone types, each tuned to a wavelength range</text>
<line x1="50" y1="170" x2="290" y2="170" stroke="#13294b" stroke-width="1.4"></line>
<path d="M55,165 Q90,55 125,165" fill="none" stroke="#1c5fb0" stroke-width="2.2"></path>
<text x="90" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c5fb0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">S</text>
<path d="M120,165 Q175,45 230,165" fill="none" stroke="#1f8a4c" stroke-width="2.2"></path>
<text x="171" y="95" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">M</text>
<path d="M150,165 Q205,60 265,165" fill="none" stroke="#c0392b" stroke-width="2.2"></path>
<text x="212" y="103" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">L</text>
<text x="55" y="185" font-size="9.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">400nm</text>
<text x="255" y="185" text-anchor="end" font-size="9.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">700nm</text>
<text x="170" y="207" text-anchor="middle" font-size="9" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">S≈420nm (2% of cones) · M≈530nm (33%) · L≈560nm (majority)</text>
<text x="480" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Opponent-process theory — neural level</text>
<text x="480" y="34" text-anchor="middle" font-size="10" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">3 pairs inhibit each other on ganglion cells (Hering, 1878)</text>
<rect x="340" y="45" width="130" height="34" fill="#fdecec" stroke="#c0392b"></rect><rect x="470" y="45" width="130" height="34" fill="#eefaf2" stroke="#1f8a4c"></rect>
<text x="405" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">RED</text>
<text x="480" y="66" text-anchor="middle" font-size="13" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">⇄</text>
<text x="535" y="66" text-anchor="middle" font-size="11" font-weight="700" fill="#155c33" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">GREEN</text>
<rect x="340" y="95" width="130" height="34" fill="#eef4fb" stroke="#1c5fb0"></rect><rect x="470" y="95" width="130" height="34" fill="#fbf6e8" stroke="#c9a227"></rect>
<text x="405" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#1c5fb0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">BLUE</text>
<text x="480" y="116" text-anchor="middle" font-size="13" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">⇄</text>
<text x="535" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#7a5c00" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">YELLOW</text>
<rect x="340" y="145" width="130" height="34" fill="#2b2b2b" stroke="#111"></rect><rect x="470" y="145" width="130" height="34" fill="#f5f5f5" stroke="#999"></rect>
<text x="405" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">BLACK</text>
<text x="480" y="166" text-anchor="middle" font-size="13" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">⇄</text>
<text x="535" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">WHITE</text>
<text x="330" y="228" text-anchor="middle" font-size="10.5" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Not rivals: trichromatic explains the receptors, opponent-process explains how they are wired together afterwards.</text>
</svg>