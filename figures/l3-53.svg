<svg width="600" height="190" viewBox="0 0 600 190" xmlns="http://www.w3.org/2000/svg">
<rect x="10" y="10" width="580" height="170" rx="12" fill="#fbf6e8" stroke="#c9a227"></rect>
<text x="300" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Rogers: three conditions for growth</text>
<rect x="30" y="52" width="170" height="80" rx="10" fill="#eef4fb" stroke="#13294b"></rect>
<text x="115" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Unconditional positive</text>
<text x="115" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">appreciation</text>
<text x="115" y="118" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">value &amp; dignity, acceptance</text>
<rect x="215" y="52" width="170" height="80" rx="10" fill="#e9f7f6" stroke="#0f7c74"></rect>
<text x="300" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Genuineness</text>
<text x="300" y="112" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">congruent, real, no role-play</text>
<rect x="400" y="52" width="170" height="80" rx="10" fill="#eefaf2" stroke="#1f8a4c"></rect>
<text x="485" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Empathy</text>
<text x="485" y="106" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">understand +</text><text x="485" y="120" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">show you understand</text>
<text x="300" y="160" text-anchor="middle" font-size="12" fill="#13294b" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">They do not replace technique — they give techniques a relational foundation.</text>
</svg>