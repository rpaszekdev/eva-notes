<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg"><rect x="70" y="8" width="460" height="52" rx="8" fill="#e9f7f6" stroke="#0f7c74" stroke-width="1.4"></rect><text x="300.0" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Formula</text><text x="300.0" y="45.5" text-anchor="middle" font-size="12" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">I notice that …  +  I wonder …  +  how do you see that?</text><rect x="20" y="74" width="270" height="54" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"></rect><text x="155.0" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Collaboration</text><text x="155.0" y="111.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">the other person sees how you reason</text><rect x="310" y="74" width="270" height="54" rx="8" fill="#fdecec" stroke="#e6b3b3" stroke-width="1.4"></rect><text x="445.0" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Reduce anxiety</text><text x="445.0" y="111.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">silent thinking becomes less threatening</text><rect x="20" y="136" width="270" height="54" rx="8" fill="#eefaf2" stroke="#a9d8bb" stroke-width="1.4"></rect><text x="155.0" y="156" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Modelling</text><text x="155.0" y="173.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">the client learns to put their own</text><text x="155.0" y="187.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">thinking into words</text><rect x="310" y="136" width="270" height="54" rx="8" fill="#fbf6e8" stroke="#e0cf9a" stroke-width="1.4"></rect><text x="445.0" y="156" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Prevent getting stuck</text><text x="445.0" y="173.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">you may say that you do not know</text><text x="445.0" y="187.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">for a moment</text></svg>