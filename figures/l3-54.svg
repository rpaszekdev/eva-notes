<svg width="600" height="222" viewBox="0 0 600 222" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l3v_a16" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs><rect x="60" y="8" width="480" height="52" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.4"></rect><text x="300.0" y="28" text-anchor="middle" font-size="12" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Case: you want to create calm, but the silence actually makes the client</text><text x="300.0" y="43" text-anchor="middle" font-size="12" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">anxious and they do not dare to begin.</text><text x="300" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">What do you do now?</text><line x1="300" y1="93" x2="100" y2="110" stroke="#13294b" stroke-width="1.6" marker-end="url(#l3v_a16)"></line><rect x="15" y="112" width="170" height="100" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"></rect><text x="31" y="136" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">A</text><text x="110" y="134" text-anchor="middle" font-size="11.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Question more forcefully</text><text x="110" y="153" text-anchor="middle" font-size="11" font-weight="400" fill="#333" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“What exactly is</text><text x="110" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#333" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">the problem?”</text><line x1="300" y1="93" x2="300" y2="110" stroke="#13294b" stroke-width="1.6" marker-end="url(#l3v_a16)"></line><rect x="215" y="112" width="170" height="100" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"></rect><text x="231" y="136" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">B</text><text x="310" y="134" text-anchor="middle" font-size="11.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Keep allowing silence</text><text x="310" y="153" text-anchor="middle" font-size="11" font-weight="400" fill="#333" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“Take your time…”</text><line x1="300" y1="93" x2="500" y2="110" stroke="#13294b" stroke-width="1.6" marker-end="url(#l3v_a16)"></line><rect x="415" y="112" width="170" height="100" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"></rect><text x="431" y="136" text-anchor="middle" font-size="20" font-weight="800" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">C</text><text x="510" y="134" text-anchor="middle" font-size="11.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Name the process +</text><text x="510" y="149" text-anchor="middle" font-size="11.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">offer an entry point</text><text x="510" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="#333" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“Can you describe</text><text x="510" y="183" text-anchor="middle" font-size="11" font-weight="400" fill="#333" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">an event?”</text></svg>