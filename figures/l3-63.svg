<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="8" width="560" height="86" rx="8" fill="#e9f7f6" stroke="#0f7c74" stroke-width="1.4"></rect><text x="36" y="28" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Example script</text><text x="36" y="45.5" text-anchor="start" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“We have 45 minutes. I suggest we first clarify together what is going on, and then</text><text x="36" y="60.5" text-anchor="start" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">look at what is needed. Is that okay with you? Are there things you definitely</text><text x="36" y="75.5" text-anchor="start" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">want to discuss?”</text><rect x="20" y="108" width="125" height="62" rx="8" fill="#fff" stroke="#b9cde0" stroke-width="1.4"></rect><text x="82.5" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Time</text><text x="82.5" y="145.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">how long?</text><rect x="165" y="108" width="125" height="62" rx="8" fill="#fff" stroke="#b9cde0" stroke-width="1.4"></rect><text x="227.5" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Goal</text><text x="227.5" y="145.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">what is this</text><text x="227.5" y="159.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">conversation for?</text><rect x="310" y="108" width="125" height="62" rx="8" fill="#fff" stroke="#b9cde0" stroke-width="1.4"></rect><text x="372.5" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Roles</text><text x="372.5" y="145.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">what do we do</text><text x="372.5" y="159.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">together?</text><rect x="455" y="108" width="125" height="62" rx="8" fill="#fff" stroke="#b9cde0" stroke-width="1.4"></rect><text x="517.5" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Space</text><text x="517.5" y="145.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">what does the</text><text x="517.5" y="159.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">client expect?</text></svg>