<svg width="680" height="128" viewBox="0 0 680 128" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l78v_a26" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs><rect x="10" y="14" width="190" height="96" rx="9" fill="#eef4fb" stroke="#1c5fb0" stroke-width="1.6"></rect><text x="105" y="36" font-size="12.5" font-weight="700" fill="#13294b" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Distal / indirect</text><text x="105" y="58" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">further away in time or chain</text><text x="105" y="74" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">e.g. father’s long illness at age 10</text><text x="105" y="90" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">→ took on a caring role</text><rect x="245" y="14" width="190" height="96" rx="9" fill="#fbf6e8" stroke="#c9a227" stroke-width="1.6"></rect><text x="340" y="36" font-size="12.5" font-weight="700" fill="#13294b" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Proximal / direct</text><text x="340" y="58" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">close to the problem, acts now</text><text x="340" y="74" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">e.g. ruminates every evening,</text><text x="340" y="90" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">stopped seeing friends</text><rect x="480" y="14" width="190" height="96" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="1.6"></rect><text x="575" y="36" font-size="12.5" font-weight="700" fill="#13294b" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Problem</text><text x="575" y="58" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">low mood</text><text x="575" y="74" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(Sara, 19)</text><text x="575" y="90" font-size="11" font-weight="400" fill="#1d2733" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"></text><line x1="202" y1="62" x2="241" y2="62" stroke="#13294b" stroke-width="2" marker-end="url(#l78v_a26)"></line><line x1="437" y1="62" x2="476" y2="62" stroke="#13294b" stroke-width="2" marker-end="url(#l78v_a26)"></line></svg>