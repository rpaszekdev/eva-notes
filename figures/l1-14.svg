<svg width="700" height="340" viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l1v_arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"></path></marker></defs><text x="22" y="22" text-anchor="start" font-size="11.5" font-weight="700" fill="#c2185b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Specific and concrete</text><line x1="40" y1="32" x2="40" y2="302" stroke="#777" stroke-width="2" marker-end="url(#l1v_arrI)"></line><text x="22" y="326" text-anchor="start" font-size="11.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Broad and overarching</text><rect x="240.0" y="12" width="340" height="44" rx="7" fill="#c2185b"></rect><text x="410" y="31" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Symptoms / signs</text><text x="410" y="47" text-anchor="middle" font-size="10" font-weight="400" fill="#fff">e.g. poor sleep, panic, intrusive thoughts, impulsivity</text><rect x="215.0" y="64" width="390" height="44" rx="7" fill="#e0641b"></rect><text x="410" y="83" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Components &amp; maladaptive drivers</text><text x="410" y="99" text-anchor="middle" font-size="10" font-weight="400" fill="#fff">clusters of strongly interrelated complaints or drivers</text><rect x="190.0" y="116" width="440" height="44" rx="7" fill="#c99312"></rect><text x="410" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Syndromes</text><text x="410" y="151" text-anchor="middle" font-size="10" font-weight="400" fill="#fff">dimensional problem profiles, broader than individual symptoms</text><rect x="165.0" y="168" width="490" height="44" rx="7" fill="#10948c"></rect><text x="410" y="187" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Subfactors</text><text x="410" y="203" text-anchor="middle" font-size="10" font-weight="400" fill="#fff">e.g. distress, fear, emotion dysregulation, antagonism</text><rect x="145.0" y="220" width="530" height="44" rx="7" fill="#5b4bb7"></rect><text x="410" y="239" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Higher-order factors</text><text x="410" y="255" text-anchor="middle" font-size="10" font-weight="400" fill="#fff">broad domains that cut across many subfactors</text><rect x="125.0" y="272" width="570" height="44" rx="7" fill="#1c4fa0"></rect><text x="410" y="291" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">General factors</text><text x="410" y="307" text-anchor="middle" font-size="10" font-weight="400" fill="#fff">transdiagnostic dimensions that influence many domains of functioning</text></svg>