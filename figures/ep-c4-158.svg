<svg width="640" height="235" viewBox="0 0 640 235" xmlns="http://www.w3.org/2000/svg">
<text x="320" y="16" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">The vestibular system (inner ear)</text>
<text x="180" y="35" text-anchor="middle" font-size="10.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">canals</text>
<g transform="translate(180,90)">
<ellipse rx="45" ry="18" transform="rotate(0)" fill="none" stroke="#13294b" stroke-width="2"></ellipse>
<ellipse rx="45" ry="18" transform="rotate(60)" fill="none" stroke="#0f7c74" stroke-width="2"></ellipse>
<ellipse rx="45" ry="18" transform="rotate(120)" fill="none" stroke="#c9a227" stroke-width="2"></ellipse>
</g>
<circle cx="160" cy="130" r="8" fill="#c0392b"></circle><circle cx="185" cy="140" r="7" fill="#c0392b"></circle>
<text x="172" y="155" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">otoliths</text>
<text x="320" y="170" text-anchor="middle" font-size="10.5" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Semicircular canals — detect head ROTATION (3 axes).</text>
<text x="320" y="186" text-anchor="middle" font-size="10.5" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Otoliths (utricle, saccule) — detect LINEAR acceleration.</text>
<text x="320" y="202" text-anchor="middle" font-size="10.5" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Canals connect to the eyes, keeping gaze fixed as the head moves.</text>
<text x="320" y="218" text-anchor="middle" font-size="10.5" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Motion sickness = a mismatch between visual and vestibular signals.</text>
</svg>