<svg width="660" height="250" viewBox="0 0 660 250" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l1v_arrH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#13294b"></path></marker></defs><rect x="10" y="10" width="142" height="150" rx="8" fill="#e9f7f6" stroke="#0f7c74" stroke-width="1.5"></rect><circle cx="34" cy="36" r="14" fill="#13294b"></circle><text x="34" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text x="56" y="41" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Problem</text><text x="81" y="78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">What is no longer</text><text x="81" y="96" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">working?</text><text x="81" y="114" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">What is at stake?</text><line x1="154" y1="85" x2="171" y2="85" stroke="#13294b" stroke-width="1.8" marker-end="url(#l1v_arrH)"></line><rect x="174" y="10" width="142" height="150" rx="8" fill="#e9f7f6" stroke="#0f7c74" stroke-width="1.5"></rect><circle cx="198" cy="36" r="14" fill="#0f7c74"></circle><text x="198" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="220" y="41" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Attempts</text><text x="245" y="78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">What has the client</text><text x="245" y="96" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">already tried?</text><text x="245" y="114" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">When does it work,</text><text x="245" y="132" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">and when not?</text><line x1="318" y1="85" x2="335" y2="85" stroke="#13294b" stroke-width="1.8" marker-end="url(#l1v_arrH)"></line><rect x="338" y="10" width="142" height="150" rx="8" fill="#e9f7f6" stroke="#0f7c74" stroke-width="1.5"></rect><circle cx="362" cy="36" r="14" fill="#13294b"></circle><text x="362" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="384" y="41" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Pattern</text><text x="409" y="78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Which biopsychosocial</text><text x="409" y="96" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">interactions contribute</text><text x="409" y="114" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">to recurrence and</text><text x="409" y="132" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">maintenance?</text><line x1="482" y1="85" x2="499" y2="85" stroke="#13294b" stroke-width="1.8" marker-end="url(#l1v_arrH)"></line><rect x="502" y="10" width="142" height="150" rx="8" fill="#e9f7f6" stroke="#0f7c74" stroke-width="1.5"></rect><circle cx="526" cy="36" r="14" fill="#0f7c74"></circle><text x="526" y="41" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text x="548" y="41" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Entry</text><text x="573" y="78" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Where can an evidence-</text><text x="573" y="96" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">informed intervention</text><text x="573" y="114" text-anchor="middle" font-size="10.5" font-weight="400" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">interrupt the pattern?</text><rect x="60" y="178" width="540" height="62" rx="10" fill="#fbf6e8" stroke="#c9a227" stroke-width="1.5"></rect><text x="330" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#5a4500" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">A diagnosis is no longer an endpoint (“the disorder”), but a</text><text x="330" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#5a4500" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">working hypothesis about a change process that has become stuck.</text></svg>