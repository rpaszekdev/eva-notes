<svg width="717" height="260" viewBox="0 0 717 260" xmlns="http://www.w3.org/2000/svg">
<g>
<rect x="60" y="40" width="46" height="150" rx="5" fill="#e4e8ef" stroke="#8b93a1"></rect>
<rect x="150" y="40" width="46" height="150" rx="5" fill="#e4e8ef" stroke="#8b93a1"></rect>
<rect x="64" y="44" width="38" height="30" rx="4" fill="none" stroke="#c9a227" stroke-width="3"></rect>
<text x="83" y="34" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7a5c00" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">cue (1)</text>
<circle cx="83" cy="166" r="11" fill="#1c5fb0"></circle><text x="83" y="212" text-anchor="middle" font-size="11.5" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">2 — same object</text>
<circle cx="173" cy="59" r="11" fill="#1c5fb0"></circle><text x="173" y="230" text-anchor="middle" font-size="11.5" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">3 — other object</text>
<circle cx="173" cy="166" r="11" fill="#cdd3dc"></circle><text x="206" y="170" font-size="11" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">4 — not compared</text>
</g>
<text x="330" y="40" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Egly, Driver &amp; Rafal (1994): attention is <tspan fill="#0f7c74">object-based</tspan></text>
<text x="330" y="64" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">The cue is at location 1. Locations 2 and 3 are the</text>
<text x="330" y="82" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"><tspan font-weight="700">same distance</tspan> from the cue — but 2 lies inside the</text>
<text x="330" y="100" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">cued rectangle and 3 lies in the other one.</text>
<rect x="330" y="116" width="290" height="58" rx="8" fill="#eefaf2" stroke="#1f8a4c"></rect>
<text x="475" y="138" text-anchor="middle" font-size="12.5" font-weight="700" fill="#155c33" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">RT(1) &lt; RT(2) &lt; RT(3)</text>
<text x="475" y="160" text-anchor="middle" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">so the response to 3 is <tspan font-weight="700">slower</tspan> than to 2</text>
<text x="330" y="196" font-size="11.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Attention “spreads out” over the <tspan font-weight="700">whole cued object</tspan>,</text>
<text x="330" y="214" font-size="11.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">not just over the cued spot — so it is not purely space-based.</text>
<text x="330" y="240" font-size="11.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">This exact figure is a mock-exam question.</text>
</svg>