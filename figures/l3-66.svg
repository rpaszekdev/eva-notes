<svg width="600" height="184" viewBox="0 0 600 184" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l3v_a36" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs><rect x="15" y="8" width="130" height="98" rx="8" fill="#e9f7f6" stroke="#9fcfca" stroke-width="1.4"></rect><text x="80.0" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Mark the time</text><text x="80.0" y="45.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“We have five</text><text x="80.0" y="59.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">minutes left.”</text><line x1="146" y1="57" x2="164" y2="57" stroke="#13294b" stroke-width="1.6" marker-end="url(#l3v_a36)"></line><rect x="165" y="8" width="130" height="98" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"></rect><text x="230.0" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Summarize</text><text x="230.0" y="45.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“Let me briefly put</text><text x="230.0" y="59.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">in order what we</text><text x="230.0" y="73.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">discussed.”</text><line x1="296" y1="57" x2="314" y2="57" stroke="#13294b" stroke-width="1.6" marker-end="url(#l3v_a36)"></line><rect x="315" y="8" width="130" height="98" rx="8" fill="#fdecec" stroke="#e6b3b3" stroke-width="1.4"></rect><text x="380.0" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Evaluate the</text><text x="380.0" y="43.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">goal</text><text x="380.0" y="61.0" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“Have we come</text><text x="380.0" y="75.0" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">closer to clarity?”</text><line x1="446" y1="57" x2="464" y2="57" stroke="#13294b" stroke-width="1.6" marker-end="url(#l3v_a36)"></line><rect x="465" y="8" width="130" height="98" rx="8" fill="#eefaf2" stroke="#a9d8bb" stroke-width="1.4"></rect><text x="530.0" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Agree on</text><text x="530.0" y="43.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">next steps</text><text x="530.0" y="61.0" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“What will we</text><text x="530.0" y="75.0" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">continue with</text><text x="530.0" y="89.0" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">next time?”</text><rect x="60" y="124" width="480" height="50" rx="8" fill="#fbf6e8" stroke="#e0cf9a" stroke-width="1.4"></rect><text x="300.0" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b3261e" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">When closing is difficult</text><text x="300.0" y="161.5" text-anchor="middle" font-size="11.3" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Discuss the pattern: “I notice that we often only get to the core quite late…”</text></svg>