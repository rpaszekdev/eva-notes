<svg width="520" height="265" viewBox="0 0 520 265" xmlns="http://www.w3.org/2000/svg">
<text x="260" y="16" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Signal detection theory: the four outcomes</text>
<rect x="140" y="50" width="170" height="90" fill="#eefaf2" stroke="#1f8a4c"></rect>
<rect x="310" y="50" width="170" height="90" fill="#fdecec" stroke="#c0392b"></rect>
<rect x="140" y="140" width="170" height="90" fill="#fdecec" stroke="#c0392b"></rect>
<rect x="310" y="140" width="170" height="90" fill="#eefaf2" stroke="#1f8a4c"></rect>
<line x1="140" y1="140" x2="480" y2="140" stroke="#13294b" stroke-width="1.6"></line>
<line x1="310" y1="50" x2="310" y2="230" stroke="#13294b" stroke-width="1.6"></line>
<rect x="140" y="50" width="340" height="180" fill="none" stroke="#13294b" stroke-width="1.6"></rect>
<text x="225" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">respond: YES</text>
<text x="395" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">respond: NO</text>
<text x="130" y="99" text-anchor="end" font-size="10.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">stimulus</text>
<text x="130" y="112" text-anchor="end" font-size="10.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">PRESENT</text>
<text x="130" y="189" text-anchor="end" font-size="10.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">stimulus</text>
<text x="130" y="202" text-anchor="end" font-size="10.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">ABSENT</text>
<text x="225" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#155c33" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">HIT</text>
<text x="225" y="108" text-anchor="middle" font-size="9.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">correct detection</text>
<text x="395" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">MISS</text>
<text x="395" y="108" text-anchor="middle" font-size="9.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">missed a real signal</text>
<text x="225" y="180" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">FALSE ALARM</text>
<text x="225" y="198" text-anchor="middle" font-size="9.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">said yes, nothing there</text>
<text x="395" y="176" text-anchor="middle" font-size="10.5" font-weight="700" fill="#155c33" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">CORRECT</text>
<text x="395" y="190" text-anchor="middle" font-size="10.5" font-weight="700" fill="#155c33" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">REJECTION</text>
<text x="395" y="204" text-anchor="middle" font-size="9.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">correctly said no</text>
<text x="260" y="252" text-anchor="middle" font-size="10.5" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">The response criterion = where you draw the line between saying "yes" and "no".</text>
</svg>