<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ep4barr3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f8a4c"></path></marker>
<marker id="ep4barr4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"></path></marker>
<marker id="ep4barr5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d9782b"></path></marker>
<marker id="ep4barr6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker>
</defs>
<text x="320" y="16" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Gate-control theory of pain (Melzack)</text>
<rect x="430" y="20" width="170" height="55" rx="8" fill="#eefaf2" stroke="#1f8a4c"></rect>
<text x="515" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">PAG + endorphins</text>
<text x="515" y="58" text-anchor="middle" font-size="9" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(brain's own pain relief)</text>
<path d="M470,75 C470,95 340,95 305,108" fill="none" stroke="#1f8a4c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ep4barr3)"></path>
<rect x="230" y="110" width="140" height="60" rx="10" fill="#f1edfb" stroke="#5b3fa0"></rect>
<text x="300" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">GATE</text>
<text x="300" y="152" text-anchor="middle" font-size="9" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(dorsal horn, spinal cord)</text>
<line x1="20" y1="90" x2="228" y2="122" stroke="#1f8a4c" stroke-width="2" marker-end="url(#ep4barr3)"></line>
<text x="25" y="80" font-size="9.3" font-weight="700" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Aβ (touch) → CLOSES gate</text>
<line x1="20" y1="140" x2="228" y2="140" stroke="#c0392b" stroke-width="2" marker-end="url(#ep4barr4)"></line>
<text x="25" y="132" font-size="9.3" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Aδ (sharp pain) → opens gate</text>
<line x1="20" y1="190" x2="228" y2="158" stroke="#d9782b" stroke-width="2" marker-end="url(#ep4barr5)"></line>
<text x="25" y="184" font-size="9.3" font-weight="700" fill="#d9782b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">C (dull pain) → opens gate</text>
<line x1="370" y1="140" x2="428" y2="140" stroke="#13294b" stroke-width="2.2" marker-end="url(#ep4barr6)"></line>
<rect x="430" y="110" width="170" height="60" rx="8" fill="#fdecec" stroke="#c0392b"></rect>
<text x="515" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">BRAIN</text>
<text x="515" y="152" text-anchor="middle" font-size="9" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(pain felt if gate stays open)</text>
<text x="320" y="225" text-anchor="middle" font-size="9.5" font-style="italic" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">rubbing a bumped elbow activates Aβ fibers → the gate closes → less pain gets through</text>
<text x="320" y="245" text-anchor="middle" font-size="9.5" font-style="italic" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">under stress, the brain can close the same gate itself, via the PAG and endorphins</text>
</svg>