<svg width="620" height="250" viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg">
<text x="20" y="92" font-size="19" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“Who experiences</text>
<text x="20" y="116" font-size="19" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">the problem?”</text>
<text x="20" y="146" font-size="11.5" fill="#556" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Not always the same person as the</text>
<text x="20" y="162" font-size="11.5" fill="#556" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">client or the commissioning party.</text>
<g fill="#fff" stroke="#c9a227" stroke-width="1.3"><rect x="330" y="15" width="270" height="88" rx="4"></rect><rect x="330" y="118" width="270" height="88" rx="4"></rect></g>
<g font-size="14.5" font-style="italic" fill="#13294b"><text x="345" y="45" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“My daughter has a</text><text x="345" y="66" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">cannabis problem.”</text>
<text x="345" y="148" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“I mainly want my parents</text><text x="345" y="169" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">to stop controlling me.”</text></g>
<g font-size="11" fill="#667" text-anchor="end"><text x="590" y="94" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">mother as referring party</text><text x="590" y="197" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">adolescent as client</text></g>
<text x="310" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Diagnostic task: do not decide who is “right”, but distinguish between perspectives.</text>
</svg>