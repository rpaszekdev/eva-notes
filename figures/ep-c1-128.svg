<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ep1arr1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs>
<g font-size="12" fill="#13294b">
<rect x="14" y="14" width="300" height="52" rx="8" fill="#eef4fb" stroke="#13294b"></rect>
<text x="24" y="33" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(1) Simple RT — say 'ka' when you hear it</text>
<text x="24" y="52" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">detection only · <tspan font-weight="700">198 ms</tspan></text>
<rect x="14" y="76" width="300" height="60" rx="8" fill="#fbf6e8" stroke="#c9a227"></rect>
<text x="24" y="95" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(3) Go / No-go — repeat only 'ka'</text>
<text x="24" y="114" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">detection + discrimination</text>
<text x="24" y="131" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">269 ms</text>
<rect x="14" y="146" width="300" height="60" rx="8" fill="#e9f7f6" stroke="#0f7c74"></rect>
<text x="24" y="165" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(2) Choice RT — repeat 'ka', 'ki' or 'ko'</text>
<text x="24" y="184" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">detection + discrimination + decision</text>
<text x="24" y="201" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">299 ms</text>
</g>
<g font-size="12.5" fill="#13294b">
<rect x="340" y="20" width="286" height="46" rx="8" fill="#fff" stroke="#c9a227" stroke-width="1.5"></rect>
<text x="352" y="40" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">discrimination = (3) − (1)</text>
<text x="352" y="58" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">269 − 198 = <tspan font-weight="700">71 ms</tspan></text>
<rect x="340" y="76" width="286" height="46" rx="8" fill="#fff" stroke="#0f7c74" stroke-width="1.5"></rect>
<text x="352" y="96" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">decision only = (2) − (3)</text>
<text x="352" y="114" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">299 − 269 = <tspan font-weight="700">30 ms</tspan></text>
<rect x="340" y="132" width="286" height="46" rx="8" fill="#fff" stroke="#13294b" stroke-width="1.5"></rect>
<text x="352" y="152" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">decision incl. discrimination = (2) − (1)</text>
<text x="352" y="170" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">299 − 198 = <tspan font-weight="700">101 ms</tspan></text>
</g>
<line x1="316" y1="43" x2="336" y2="43" stroke="#13294b" stroke-width="1.4" marker-end="url(#ep1arr1)"></line>
<line x1="316" y1="106" x2="336" y2="99" stroke="#13294b" stroke-width="1.4" marker-end="url(#ep1arr1)"></line>
<line x1="316" y1="176" x2="336" y2="155" stroke="#13294b" stroke-width="1.4" marker-end="url(#ep1arr1)"></line>
<text x="320" y="238" text-anchor="middle" font-size="12" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Each task adds one mental step. Subtract the tasks and you get the time of that step.</text>
</svg>