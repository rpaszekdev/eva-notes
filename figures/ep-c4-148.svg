<svg width="640" height="305" viewBox="0 0 640 305" xmlns="http://www.w3.org/2000/svg">
<text x="107" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">1 · Proximity</text>
<circle cx="40" cy="95" r="5" fill="#13294b"></circle><circle cx="52" cy="95" r="5" fill="#13294b"></circle><circle cx="64" cy="95" r="5" fill="#13294b"></circle>
<circle cx="110" cy="95" r="5" fill="#13294b"></circle><circle cx="150" cy="95" r="5" fill="#13294b"></circle><circle cx="190" cy="95" r="5" fill="#13294b"></circle>
<text x="107" y="140" text-anchor="middle" font-size="9.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">close items look grouped</text>
<text x="312" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">2 · Similarity</text>
<g fill="#13294b"><circle cx="235" cy="85" r="7"></circle><circle cx="275" cy="85" r="7"></circle><circle cx="315" cy="85" r="7"></circle><circle cx="355" cy="85" r="7"></circle><circle cx="395" cy="85" r="7"></circle></g>
<g fill="none" stroke="#c9a227" stroke-width="2"><circle cx="235" cy="115" r="7"></circle><circle cx="275" cy="115" r="7"></circle><circle cx="315" cy="115" r="7"></circle><circle cx="355" cy="115" r="7"></circle><circle cx="395" cy="115" r="7"></circle></g>
<text x="312" y="140" text-anchor="middle" font-size="9.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">similar items look grouped</text>
<text x="525" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">3 · Closure</text>
<circle cx="525" cy="98" r="38" fill="none" stroke="#13294b" stroke-width="4" stroke-dasharray="16 10"></circle>
<text x="525" y="140" text-anchor="middle" font-size="9.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">gaps get filled in; seen as whole</text>
<text x="107" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">4 · Continuity</text>
<path d="M20,225 Q107,258 195,225" fill="none" stroke="#13294b" stroke-width="2.5"></path>
<line x1="107" y1="212" x2="107" y2="272" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"></line>
<text x="55" y="235" font-size="11" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">✓ smooth</text>
<text x="140" y="222" font-size="11" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">✗ sharp turn</text>
<text x="107" y="292" text-anchor="middle" font-size="9.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">we follow smooth lines, not sharp turns</text>
<text x="312" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">5 · Common fate</text>
<rect x="225" y="218" width="150" height="36" rx="6" fill="none" stroke="#13294b" stroke-dasharray="5 4"></rect>
<g font-size="13" fill="#13294b"><text x="245" y="240" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">→</text><text x="280" y="240" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">→</text><text x="315" y="240" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">→</text><text x="350" y="240" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">→</text></g>
<circle cx="385" cy="258" r="4" fill="#c0392b"></circle><text x="393" y="262" font-size="13" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">↓</text>
<text x="312" y="292" text-anchor="middle" font-size="9.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">moving the same way = grouped together</text>
<text x="525" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">6 · Figure-ground</text>
<rect x="465" y="215" width="120" height="55" fill="#fff" stroke="#cdd3dc"></rect>
<circle cx="525" cy="242" r="24" fill="#222"></circle>
<text x="525" y="292" text-anchor="middle" font-size="9.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">black = figure, white = ground</text>
</svg>