<svg width="600" height="232" viewBox="0 0 600 232" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l3v_a23" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs><rect x="30" y="12" width="220" height="74" rx="8" fill="#e9f7f6" stroke="#0f7c74" stroke-width="1.4"></rect><text x="140.0" y="32" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Insight sprouts</text><text x="140.0" y="49.5" text-anchor="middle" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“I now see what is</text><text x="140.0" y="64.5" text-anchor="middle" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">happening differently.”</text><line x1="254" y1="49" x2="346" y2="49" stroke="#13294b" stroke-width="1.6" marker-end="url(#l3v_a23)"></line><rect x="350" y="12" width="220" height="74" rx="8" fill="#fbf6e8" stroke="#c9a227" stroke-width="1.4"></rect><text x="460.0" y="32" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5c00" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Try behaviour</text><text x="460.0" y="49.5" text-anchor="middle" font-size="11.5" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“I want to try, but how?”</text><text x="300" y="108" text-anchor="middle" font-size="11" font-weight="400" fill="#555" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">The consulting room is the warm greenhouse; new behaviour has to take root outside.</text><text x="300" y="134" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Coach check before you send the client “onto the field”</text><rect x="12" y="146" width="132" height="76" rx="8" fill="#eef4fb" stroke="#9fb9dc" stroke-width="1.4"></rect><text x="78.0" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Can?</text><text x="78.0" y="183.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Does the client</text><text x="78.0" y="197.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">have the skill?</text><rect x="160" y="146" width="132" height="76" rx="8" fill="#fdecec" stroke="#e6b3b3" stroke-width="1.4"></rect><text x="226.0" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Dare?</text><text x="226.0" y="183.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Is there enough</text><text x="226.0" y="197.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">confidence in their</text><text x="226.0" y="211.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">own ability?</text><rect x="308" y="146" width="132" height="76" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"></rect><text x="374.0" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Plan?</text><text x="374.0" y="183.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Is the step small</text><text x="374.0" y="197.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">enough to be</text><text x="374.0" y="211.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">achievable?</text><rect x="456" y="146" width="132" height="76" rx="8" fill="#eefaf2" stroke="#a9d8bb" stroke-width="1.4"></rect><text x="522.0" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Follow-up?</text><text x="522.0" y="183.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">When will we</text><text x="522.0" y="197.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">evaluate what</text><text x="522.0" y="211.5" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">happened?</text></svg>