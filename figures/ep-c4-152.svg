<svg width="640" height="310" viewBox="0 0 640 310" xmlns="http://www.w3.org/2000/svg">
<text x="320" y="16" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">The cochlea, unrolled: the basilar membrane</text>
<text x="130" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">BASE — narrow &amp; stiff</text>
<text x="520" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">APEX — wide &amp; floppy</text>
<path d="M70,150 L580,90 L580,210 L70,170 Z" fill="#eef4fb" stroke="#13294b" stroke-width="2"></path>
<ellipse cx="130" cy="159" rx="38" ry="12" fill="#c0392b" opacity=".35"></ellipse>
<ellipse cx="340" cy="155" rx="55" ry="24" fill="#c9a227" opacity=".35"></ellipse>
<ellipse cx="520" cy="151" rx="58" ry="44" fill="#0f7c74" opacity=".3"></ellipse>
<text x="130" y="132" text-anchor="middle" font-size="9" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">≈20,000 Hz</text>
<text x="340" y="118" text-anchor="middle" font-size="9" font-weight="700" fill="#7a5c00" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">≈1,000–4,000 Hz</text>
<text x="520" y="90" text-anchor="middle" font-size="9" font-weight="700" fill="#0f5f59" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">≈50–200 Hz</text>
<text x="320" y="248" text-anchor="middle" font-size="10.5" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Frequency theory: pitch = firing rate of the neuron (correct for LOW tones only).</text>
<text x="320" y="264" text-anchor="middle" font-size="10.5" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Problem: a neuron's max firing rate is ≈1,000 Hz, but we hear much higher pitches.</text>
<text x="320" y="280" text-anchor="middle" font-size="10.5" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Place theory (Békésy): different frequencies peak at different PLACES on the membrane.</text>
<text x="320" y="296" text-anchor="middle" font-size="10.5" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Together: tonotopic organization — kept all the way to A1.</text>
</svg>