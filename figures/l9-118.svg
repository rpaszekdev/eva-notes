<text x="172" y="200" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">talking with the aim of <tspan font-weight="700">influencing or</tspan></text>
<text x="172" y="218" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"><tspan font-weight="700">changing</tspan> the client&#39;s behaviour</text>
