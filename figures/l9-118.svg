<svg width="620" height="250" viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg">
<g font-size="12.5">
<circle cx="110" cy="48" r="44" fill="#29a3d9"></circle>
<text x="110" y="44" text-anchor="middle" font-weight="700" fill="#fff" font-size="13">Information</text>
<text x="110" y="61" text-anchor="middle" font-weight="700" fill="#fff" font-size="13">mode</text>
<text x="172" y="42" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">talking in order to <tspan font-weight="700">exchange, convey</tspan></text>
<text x="172" y="60" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"><tspan font-weight="700">and gather</tspan> information</text>
<circle cx="110" cy="130" r="42" fill="#1c7fb0"></circle>
<text x="110" y="126" text-anchor="middle" font-weight="700" fill="#fff" font-size="13">Consensus</text>
<text x="110" y="143" text-anchor="middle" font-weight="700" fill="#fff" font-size="13">mode</text>
<text x="172" y="124" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">consultation aimed at <tspan font-weight="700">reaching agreement</tspan></text>
<text x="172" y="142" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(e.g. about the recommendations)</text>
