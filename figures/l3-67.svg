<svg width="600" height="254" viewBox="0 0 600 254" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l3v_a37" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs><rect x="20" y="8" width="250" height="122" rx="8" fill="#e9f7f6" stroke="#0f7c74" stroke-width="1.4"></rect><text x="36" y="28" text-anchor="start" font-size="14" font-weight="700" fill="#0f7c74" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">First phase</text><text x="36" y="47" text-anchor="start" font-size="11.3" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">• connect with the client’s</text><text x="36" y="62" text-anchor="start" font-size="11.3" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"> frame of reference</text><text x="36" y="77" text-anchor="start" font-size="11.3" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">• listen, reflect, summarize</text><text x="36" y="92" text-anchor="start" font-size="11.3" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">• often do NOT show</text><text x="36" y="107" text-anchor="start" font-size="11.3" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"> interpretations yet</text><line x1="273" y1="69" x2="327" y2="69" stroke="#13294b" stroke-width="1.6" marker-end="url(#l3v_a37)"></line><rect x="330" y="8" width="250" height="122" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="1.4"></rect><text x="346" y="28" text-anchor="start" font-size="14" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Second phase</text><text x="346" y="47" text-anchor="start" font-size="11.3" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">• make connections</text><text x="346" y="62" text-anchor="start" font-size="11.3" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">• test new meanings</text><text x="346" y="77" text-anchor="start" font-size="11.3" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">• more active and sometimes</text><text x="346" y="92" text-anchor="start" font-size="11.3" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"> more directive</text><rect x="40" y="144" width="520" height="46" rx="8" fill="#fff" stroke="#c7cdd6" stroke-width="1.4"></rect><text x="300.0" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Timing question</text><text x="300.0" y="181" text-anchor="middle" font-size="10.8" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Is the relationship strong enough for the client to tolerate and explore a new perspective?</text><rect x="40" y="200" width="520" height="44" rx="8" fill="#eef4fb" stroke="#b9cde0" stroke-width="1.4"></rect><text x="300.0" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Core quality</text><text x="300.0" y="237" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Do not persuade — offer a possible new meaning and test it.</text></svg>