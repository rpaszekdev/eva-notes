<svg width="772" height="285" viewBox="0 0 772 285" xmlns="http://www.w3.org/2000/svg">
<text x="165" y="18" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Myopia — eye too LONG</text>
<ellipse cx="150" cy="90" rx="90" ry="55" fill="#fdecec" stroke="#13294b" stroke-width="1.6"></ellipse>
<line x1="240" y1="40" x2="240" y2="140" stroke="#c0392b" stroke-width="4"></line>
<text x="240" y="158" text-anchor="middle" font-size="10" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">retina</text>
<ellipse cx="80" cy="90" rx="10" ry="28" fill="#cfe8ff" stroke="#13294b"></ellipse>
<path d="M80,70 L190,90 L240,78" fill="none" stroke="#13294b" stroke-width="1.3"></path>
<path d="M80,110 L190,90 L240,102" fill="none" stroke="#13294b" stroke-width="1.3"></path>
<circle cx="190" cy="90" r="4" fill="#c0392b"></circle>
<text x="190" y="35" text-anchor="middle" font-size="10.5" fill="#c0392b" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">focus falls BEFORE retina</text>
<text x="165" y="182" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">blurred distant objects</text>
<text x="165" y="198" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">corrected with a concave (–) lens</text>
<text x="495" y="18" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c5fb0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Hyperopia — eye too SHORT</text>
<ellipse cx="480" cy="90" rx="65" ry="55" fill="#eef4fb" stroke="#13294b" stroke-width="1.6"></ellipse>
<line x1="545" y1="40" x2="545" y2="140" stroke="#c0392b" stroke-width="4"></line>
<text x="545" y="158" text-anchor="middle" font-size="10" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">retina</text>
<ellipse cx="425" cy="90" rx="10" ry="28" fill="#cfe8ff" stroke="#13294b"></ellipse>
<path d="M425,70 L520,84 L600,90" fill="none" stroke="#13294b" stroke-width="1.3"></path>
<path d="M425,110 L520,96 L600,90" fill="none" stroke="#13294b" stroke-width="1.3"></path>
<circle cx="600" cy="90" r="4" fill="#1c5fb0"></circle>
<text x="545" y="35" text-anchor="middle" font-size="10.5" fill="#1c5fb0" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">focus falls BEHIND retina</text>
<text x="495" y="182" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">blurred close objects</text>
<text x="495" y="198" text-anchor="middle" font-size="11" fill="#333" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">corrected with a convex (+) lens</text>
<line x1="20" y1="222" x2="640" y2="222" stroke="#cdd3dc"></line>
<text x="330" y="242" text-anchor="middle" font-size="11" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"><tspan font-weight="700">Astigmatism</tspan>: cornea/lens is not perfectly round → several focal points → blurry at all distances → cylinder lens.</text>
<text x="330" y="262" text-anchor="middle" font-size="11" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"><tspan font-weight="700">Presbyopia</tspan>: after ~40 years the lens stiffens (like hyperopia, but age-related) → reading glasses (convex).</text>
<text x="330" y="280" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Also: cataract = clouded lens · macular degeneration = fovea degenerates (centre is black/distorted) · glaucoma = high eye pressure damages peripheral vision.</text>
</svg>