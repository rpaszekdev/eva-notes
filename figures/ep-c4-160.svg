<svg width="640" height="270" viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg">
<text x="320" y="16" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Tongue → taste buds → brain</text>
<rect x="60" y="55" width="260" height="165" rx="80" ry="90" fill="#fdecec" stroke="#c0392b" stroke-width="2"></rect>
<g fill="#f3aeae" stroke="#c0392b" stroke-width=".8">
<circle cx="100" cy="90" r="5"></circle><circle cx="140" cy="78" r="5"></circle><circle cx="180" cy="74" r="5"></circle><circle cx="220" cy="78" r="5"></circle><circle cx="260" cy="90" r="5"></circle>
<circle cx="90" cy="140" r="5"></circle><circle cx="290" cy="140" r="5"></circle>
<circle cx="110" cy="190" r="5"></circle><circle cx="150" cy="205" r="5"></circle><circle cx="200" cy="207" r="5"></circle><circle cx="250" cy="200" r="5"></circle><circle cx="285" cy="185" r="5"></circle>
</g>
<text x="190" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">5 basic tastes: sweet · salty · sour · bitter · umami</text>
<text x="190" y="253" text-anchor="middle" font-size="9" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">no special zones — every part of the tongue senses all five</text>
<circle cx="460" cy="90" r="55" fill="#fff" stroke="#c0392b" stroke-width="1.6"></circle>
<ellipse cx="440" cy="80" rx="14" ry="9" fill="#eefaf2" stroke="#1f8a4c"></ellipse>
<ellipse cx="470" cy="70" rx="14" ry="9" fill="#eefaf2" stroke="#1f8a4c"></ellipse>
<ellipse cx="455" cy="112" rx="14" ry="9" fill="#eefaf2" stroke="#1f8a4c"></ellipse>
<text x="460" y="25" text-anchor="middle" font-size="10" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">1 papilla (bump)</text>
<text x="460" y="160" text-anchor="middle" font-size="8.7" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">taste buds (hundreds per papilla)</text>
<ellipse cx="460" cy="210" rx="70" ry="38" fill="#fff" stroke="#1f8a4c" stroke-width="1.6"></ellipse>
<g stroke="#13294b" stroke-width="1.3"><line x1="430" y1="192" x2="430" y2="215"></line><line x1="445" y1="188" x2="445" y2="215"></line><line x1="460" y1="186" x2="460" y2="215"></line><line x1="475" y1="188" x2="475" y2="215"></line><line x1="490" y1="192" x2="490" y2="215"></line></g>
<circle cx="460" cy="182" r="3.5" fill="#c9a227"></circle>
<text x="460" y="177" text-anchor="middle" font-size="8" fill="#7a5c00" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">tastant</text>
<text x="460" y="230" text-anchor="middle" font-size="8.7" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">50–100 taste receptor cells</text>
<text x="460" y="256" text-anchor="middle" font-size="9" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">→ cranial nerve → gustatory cortex</text>
</svg>