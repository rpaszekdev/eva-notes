<text x="320" y="292" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Nasal fibers cross at the chiasm (contralateral) · temporal fibers stay on the same side (ipsilateral).</text>
<text x="320" y="306" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">About 10% of the optic nerve branches to the superior colliculus, to trigger the next reflexive saccade.</text>
