<svg width="600" height="170" viewBox="0 0 600 170" xmlns="http://www.w3.org/2000/svg"><line x1="40" y1="55" x2="220" y2="55" stroke="#c0392b" stroke-width="2"></line><line x1="380" y1="55" x2="560" y2="55" stroke="#c0392b" stroke-width="2"></line><text x="60" y="38" text-anchor="start" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Too authoritarian</text><text x="560" y="38" text-anchor="end" font-size="12.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Too vague</text><ellipse cx="300" cy="55" rx="80" ry="24" fill="#e9f7f6" stroke="#0f7c74" stroke-width="1.5"></ellipse><text x="300" y="59" text-anchor="middle" font-size="12.5" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Offer tentatively</text><text x="30" y="95" text-anchor="start" font-size="11.5" font-weight="400" fill="#333" font-style="italic" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“That’s how it is. You need to think differently.”</text><rect x="60" y="110" width="480" height="50" rx="8" fill="#fdecec" stroke="#e6b3b3" stroke-width="1.4"></rect><text x="300.0" y="130" text-anchor="middle" font-size="12" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">“Could it be that avoidance brings relief in the short term,</text><text x="300.0" y="145" text-anchor="middle" font-size="12" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">but makes the anxiety greater in the long term?”</text></svg>