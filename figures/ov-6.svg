<svg width="640" height="440" viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg"><defs><marker id="l1v_arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#13294b"></path></marker></defs><rect x="150" y="8" width="260" height="46" rx="9" fill="#13294b"></rect><text x="280" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Do you have a</text><text x="280" y="45" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">question about the course?</text><rect x="150" y="80" width="260" height="56" rx="8" fill="#eef4fb" stroke="#1c5fb0"></rect><text x="280" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#13294b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">1. First, consult the syllabus</text><text x="280" y="121" text-anchor="middle" font-size="10.5" font-weight="400" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">to see whether you can find the answer there.</text><rect x="470" y="83" width="160" height="50" rx="8" fill="#e6f6ec" stroke="#1f8a4c"></rect><text x="550" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Great!</text><text x="550" y="122" text-anchor="middle" font-size="9.5" font-weight="400" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Your question has been answered.</text><line x1="410" y1="108" x2="467" y2="108" stroke="#13294b" stroke-width="1.6" marker-end="url(#l1v_arrC)"></line><text x="439" y="100" text-anchor="middle" font-size="9" font-weight="400" fill="#1f8a4c" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">answer found</text><line x1="280" y1="54" x2="280" y2="77" stroke="#13294b" stroke-width="1.6" marker-end="url(#l1v_arrC)"></line><line x1="280" y1="136" x2="280" y2="165" stroke="#13294b" stroke-width="1.6" marker-end="url(#l1v_arrC)"></line><rect x="288" y="143" width="62" height="16" rx="4" fill="#fdecec" stroke="#c0392b" stroke-width=".8"></rect><text x="319" y="155" text-anchor="middle" font-size="9.5" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">no answer</text><rect x="150" y="168" width="260" height="56" rx="8" fill="#fbf6e8" stroke="#c9a227"></rect><text x="280" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#5a4500" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">2. Ask your question</text><text x="280" y="209" text-anchor="middle" font-size="10.5" font-weight="400" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">to the course coordinator after a lecture.</text><line x1="280" y1="224" x2="280" y2="253" stroke="#13294b" stroke-width="1.6" marker-end="url(#l1v_arrC)"></line><rect x="150" y="256" width="260" height="56" rx="8" fill="#f1edfb" stroke="#5b3fa0"></rect><text x="280" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">3. Only contact us by email</text><text x="280" y="297" text-anchor="middle" font-size="10.5" font-weight="400" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">for urgent or personal questions.</text><rect x="450" y="232" width="182" height="46" rx="8" fill="#f1edfb" stroke="#5b3fa0"></rect><text x="541" y="251" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Urgent questions:</text><text x="541" y="268" text-anchor="middle" font-size="10" font-weight="400" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">direct these to Nessa Ikani.</text><rect x="450" y="288" width="182" height="58" rx="8" fill="#f1edfb" stroke="#5b3fa0"></rect><text x="541" y="305" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Urgent questions about</text><text x="541" y="320" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">assignments &amp; practicals:</text><text x="541" y="337" text-anchor="middle" font-size="10" font-weight="400" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">direct these to Nessa Ikani.</text><path d="M410 284 L430 284 L430 255 L447 255" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l1v_arrC)"></path><path d="M430 284 L430 317 L447 317" fill="none" stroke="#13294b" stroke-width="1.5" marker-end="url(#l1v_arrC)"></path><rect x="90" y="362" width="460" height="68" rx="9" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"></rect><rect x="260" y="352" width="120" height="20" rx="5" fill="#c0392b"></rect><text x="320" y="366" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">Important</text><text x="320" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">⦸  Do not contact lecturers via Canvas.</text><text x="320" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">⦸  Do not contact practical-session instructors directly.</text></svg>