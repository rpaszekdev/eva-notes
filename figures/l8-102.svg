<text x="25" y="95" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">A</text><text x="110" y="95" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">O</text><text x="25" y="160" fill="#1c5fb0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">B</text>
<text x="155" y="95" fill="#c0392b" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">A</text><text x="240" y="95" fill="#5b3fa0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">O</text><text x="155" y="160" fill="#1c5fb0" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">B</text>
