<g font-size="11" text-anchor="middle" fill="#13294b" font-weight="700">
<text x="65" y="22" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">B is a proxy for A</text><text x="65" y="36" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">as risk factor for O</text>
<text x="195" y="22" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">A and B are</text><text x="195" y="36" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">overlapping</text>
<text x="325" y="22" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">A and B are</text><text x="325" y="36" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">independent</text>
<text x="455" y="22" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">B mediates the</text><text x="455" y="36" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">effect of A on O</text>
<text x="585" y="22" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">A moderates the</text><text x="585" y="36" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">effect of B on O</text>
</g>
