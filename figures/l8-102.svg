<g font-size="10.5" fill="#445" text-anchor="middle">
<text x="65" y="188" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">B's link with O disappears</text><text x="65" y="199" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">once A is considered</text>
<text x="195" y="188" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">both measure partly</text><text x="195" y="199" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">the same thing</text>
<text x="325" y="188" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">each adds its own</text><text x="325" y="199" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">separate risk</text>
<text x="455" y="188" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">A works THROUGH B</text><text x="455" y="199" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">(A→B→O)</text>
<text x="585" y="188" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">A changes how strong</text><text x="585" y="199" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">the B→O link is</text>
</g>
<text x="325" y="228" font-size="10.5" fill="#445" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Left → right = temporal order. Solid arrow = correlation/effect.</text><text x="325" y="243" font-size="10.5" fill="#445" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Dotted = the association weakens or disappears when the other risk factor is considered.</text>
