<svg width="640" height="210" viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ep5arr1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#13294b"></path></marker></defs>
<g font-size="12" fill="#13294b">
<rect x="10" y="60" width="130" height="66" rx="8" fill="#eef4fb" stroke="#1c5fb0"></rect>
<text x="75" y="84" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Sensory memory</text>
<text x="75" y="102" text-anchor="middle" font-size="11" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">a few seconds or less</text>
<text x="75" y="118" text-anchor="middle" font-size="11" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">iconic · echoic</text>
<rect x="200" y="60" width="150" height="66" rx="8" fill="#fbf6e8" stroke="#c9a227"></rect>
<text x="275" y="84" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Short-term memory</text>
<text x="275" y="102" text-anchor="middle" font-size="11" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">&lt; 1 minute · 7 ± 2 items</text>
<text x="275" y="118" text-anchor="middle" font-size="11" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">conscious activity</text>
<rect x="410" y="60" width="150" height="66" rx="8" fill="#eefaf2" stroke="#1f8a4c"></rect>
<text x="485" y="84" text-anchor="middle" font-weight="700" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Long-term memory</text>
<text x="485" y="102" text-anchor="middle" font-size="11" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">hours → years</text>
<text x="485" y="118" text-anchor="middle" font-size="11" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">almost unlimited</text>
</g>
<g stroke="#13294b" stroke-width="1.6" marker-end="url(#ep5arr1)">
<line x1="144" y1="93" x2="196" y2="93"></line><line x1="354" y1="86" x2="406" y2="86"></line>
</g>
<path d="M410 112 L354 112" stroke="#13294b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ep5arr1)" fill="none"></path>
<text x="382" y="140" text-anchor="middle" font-size="10.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">recall</text>
<path d="M275 60 C275 30 230 26 230 46 C230 60 250 62 275 60" fill="none" stroke="#c9a227" stroke-width="1.6" marker-end="url(#ep5arr1)"></path>
<text x="196" y="36" font-size="11" fill="#7a5c00" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">repetition / rehearsal</text>
<text x="20" y="34" font-size="11.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">information in the world →</text>
<text x="320" y="180" text-anchor="middle" font-size="12" font-style="italic" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Atkinson &amp; Shiffrin (1968): items must pass all three stages before they can be remembered.</text>
<text x="320" y="198" text-anchor="middle" font-size="11.5" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="3.2" stroke-linejoin="round">Each sensory modality probably has its own sensory memory; STM controls transfer to and retrieval from LTM.</text>
